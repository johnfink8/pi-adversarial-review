name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      # npm install, not npm ci: the lockfile is written on macOS and omits
      # other platforms' optional native packages.
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node scripts/check-pack.mjs
