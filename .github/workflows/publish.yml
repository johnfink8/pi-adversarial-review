name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Cheap and decisive, so before anything slow.
      - name: Verify the release can be published
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME (=$TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi
          # npm publish without --tag makes any version `latest`, so a prerelease
          # would become everyone's default install.
          if [ "$PRERELEASE" = "true" ] || [[ "$PKG_VERSION" == *-* ]]; then
            echo "prereleases are not published by this workflow ($PKG_VERSION, prerelease=$PRERELEASE)"
            exit 1
          fi
          grep -qF "## [$PKG_VERSION] - " CHANGELOG.md \
            || { echo "CHANGELOG.md has no '## [$PKG_VERSION] - <date>' entry"; exit 1; }

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          package-manager-cache: false
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node scripts/check-pack.mjs

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install
      # The release flow is stage-publish, not direct publish: npm recommends
      # against granting bypass-2FA publish to tokens and is restricting
      # direct publishing for them. npm stage publish defers 2FA to approval
      # and never publishes live from CI — the registry enforces that, so
      # there is nothing to verify afterwards; a maintainer approves on npmjs
      # (package page → Staged Packages) or npm stage approve with 2FA.
      # Provenance still signs (id-token: write) — registry auth and
      # attestation are separate. Staged publishing needs npm >= 11.15.0,
      # which the runner's bundled npm may predate.
      - name: Stage publish (approve on npmjs with 2FA to make it live)
        run: |
          npm install -g npm@latest
          npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
